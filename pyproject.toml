[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "citetrail"
version = "0.1.0"
description = "Local, provenance-backed browser capture and recall."
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
citetrail = "citetrail.cli:main"

[tool.setuptools.packages.find]
include = ["citetrail*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
